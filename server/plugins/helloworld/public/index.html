<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hello World Plugin</title>
    <!-- Redirect to the SPA route so the page uses the website's styles and layout -->
    <meta http-equiv="refresh" content="0;url=/helloworld">
    <script>window.location.replace('/helloworld');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Minimal fallback styling while redirect happens */
      html,body{height:100%;margin:0;font-family:Plus Jakarta Sans, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
      .redirect-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e6eef8;padding:2rem}
      .box{max-width:720px;background:rgba(255,255,255,0.03);padding:2rem;border-radius:12px;border:1px solid rgba(255,255,255,0.03);text-align:center}
      a{color:#7dd3fc}
    </style>
  </head>
  <body>
    <div class="redirect-wrap">
      <div class="box">
        <h1 style="margin-top:0;margin-bottom:0.5rem">Hello World Plugin</h1>
        <p style="margin:0 0 1rem 0;opacity:0.9">Redirecting to the website's Hello World page to use the site's layout and styles.</p>
        <p style="margin:0.5rem 0 0 0;font-size:0.95rem">If you are not redirected automatically, <a href="/helloworld">click here</a>.</p>
        <p style="margin-top:1rem;font-size:0.85rem;opacity:0.8">Admin settings are available at <a href="/admin/helloworld">/admin/helloworld</a>.</p>
      </div>
    </div>
  </body>
</html>
